<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>First Time Setup</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <h1>Create First Admin</h1>
  <p style="font-size:13px; margin-bottom:10px;">This only works once, when the database has no accounts yet.</p>
  <form id="setupForm">
    <label>Name</label>
    <input type="text" id="name" required>
    <label>Email</label>
    <input type="email" id="email" required>
    <label>Password</label>
    <input type="password" id="password" required>
    <button type="submit">Create Admin Account</button>
    <div class="error" id="errorMsg"></div>
  </form>
  <p style="margin-top:16px; font-size:14px;"><a href="login.html">Back to login</a></p>
</div>
<script src="js/setup.js"></script>
</body>
</html>
